<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>더펄슨후 | 공격군 서브딜러 겐지</title>
  <meta name="description" content="공격군 서브딜러 겐지 플레이어 더펄슨후의 프로필. 정교한 표창 에임, 탁월한 용검 실력, 팀을 승리로 이끄는 사이드 플레이." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f06414' d='M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z'/%3E%3C/svg%3E" />

  <!-- 본문 글꼴: Pretendard. 불러오지 못하면 시스템 글꼴로 대체됩니다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 색 값은 style.css의 CSS 변수에서 정하고, 여기서는 Tailwind 클래스 이름만 연결합니다.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', "Pretendard", "-apple-system", "BlinkMacSystemFont", "system-ui", "sans-serif"],
          },
          colors: {
            page: "var(--page)",
            panel: "var(--panel)",
            ink: "var(--ink)",
            muted: "var(--muted)",
            line: "var(--line)",
            navy: "var(--navy)",
            violet: "var(--violet)",
            tile: "var(--tile)",
            soft: "var(--soft)",
            accent: "var(--accent)",
            lime: "var(--lime)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="font-sans">
  <!-- 아이콘 모음: script.js가 <use href="#i-이름">으로 가져다 씁니다. -->
  <svg width="0" height="0" class="absolute" aria-hidden="true">
    <symbol id="i-shuriken" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5zM12 10a2 2 0 100 4 2 2 0 000-4z" />
    </symbol>
    <symbol id="i-blade" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 3.5L9 15" />
        <path d="M20.5 3.5l-1 4.5L10.5 16.5" />
        <path d="M7 12.5l4.5 4.5" />
        <path d="M9.2 14.8L4 20" />
      </g>
    </symbol>
    <symbol id="i-flank" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20c0-8 5-13 14-13" />
        <path d="M14 3l4 4-4 4" />
        <circle cx="4" cy="20" r="1.2" fill="currentColor" />
      </g>
    </symbol>
    <symbol id="i-diamond" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M6 3h12l4 6-10 12L2 9z" />
        <path d="M2 9h20M9 3l3 18M15 3l-3 18M6 3l3 6M18 3l-3 6" />
      </g>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
      </g>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="12" r="8" />
        <circle cx="12" cy="12" r="3" />
        <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke-linecap="round" />
      </g>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
      </g>
    </symbol>
  </svg>

  <!-- 헤더: 화면 위에 떠 있는 반투명 바 -->
  <header id="site-header" class="fixed inset-x-0 top-0 z-40 px-3 pt-3 sm:px-4">
    <div class="bar panel flex h-16 items-stretch overflow-hidden rounded-lg sm:h-[72px]">
      <!-- 로고 영역: 한 단계 밝은 블록 -->
      <a href="#top" class="panel-top flex items-center gap-2.5 px-5 text-xl font-extrabold tracking-tight sm:px-7 sm:text-2xl">
        <svg class="h-6 w-6 text-accent" aria-hidden="true"><use href="#i-shuriken" /></svg>
        <span data-bind="name"></span>
      </a>

      <nav aria-label="주 메뉴" class="hidden flex-1 items-center px-8 md:flex lg:px-10">
        <ul class="flex items-center gap-8 text-[17px] font-bold lg:gap-10">
          <li><a class="nav-link" href="#about">소개</a></li>
          <li><a class="nav-link" href="#skills">스킬</a></li>
          <li><a class="nav-link" href="#projects">프로젝트</a></li>
          <li><a class="nav-link" href="#contact">연락처</a></li>
        </ul>
      </nav>

      <div class="ml-auto flex items-center gap-3 pr-3 sm:pr-4">
        <a href="#contact" class="btn-accent hidden rounded-md px-5 py-3 text-[15px] font-bold sm:inline-block">지금 연락하기</a>
        <button id="menu-btn" type="button" class="flex h-11 w-11 items-center justify-center rounded-md hover:bg-white/60 md:hidden" aria-expanded="false" aria-controls="mobile-menu" aria-label="메뉴 열기">
          <svg class="h-6 w-6" aria-hidden="true"><use href="#i-grid" /></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 모바일 메뉴: 헤더 아래로 펼쳐지는 패널 -->
  <div id="mobile-menu" class="fixed inset-x-3 top-[84px] z-50 sm:inset-x-4" role="dialog" aria-modal="true" aria-label="메뉴">
    <div class="panel overflow-hidden rounded-lg">
      <div class="panel-top flex items-center justify-between px-5 py-4">
        <span class="text-lg font-extrabold" data-bind="name"></span>
        <button id="menu-close" type="button" class="rounded-md px-3 py-1.5 text-sm font-semibold text-muted hover:bg-white">닫기 ✕</button>
      </div>
      <nav class="flex flex-col p-2 text-lg font-bold">
        <a class="rounded-md px-4 py-3 hover:bg-white/70" href="#about">소개</a>
        <a class="rounded-md px-4 py-3 hover:bg-white/70" href="#skills">스킬</a>
        <a class="rounded-md px-4 py-3 hover:bg-white/70" href="#projects">프로젝트</a>
        <a class="rounded-md px-4 py-3 hover:bg-white/70" href="#contact">연락처</a>
      </nav>
      <div class="p-4 pt-0">
        <a href="#contact" class="btn-accent block rounded-md py-3 text-center font-bold">지금 연락하기</a>
      </div>
    </div>
  </div>

  <main>
    <!-- 히어로: 블루바이올렛 배경 + 왼쪽 글, 오른쪽 이미지 -->
    <section id="top" class="hero-bg relative flex min-h-[100svh] items-center overflow-hidden text-white">
      <!-- 히어로 이미지: data.js의 heroImage 파일을 불러오고, 없으면 표창 장식을 보여줍니다. -->
      <img id="hero-img" class="absolute inset-0 hidden h-full w-full object-cover object-right" alt="" />
      <svg id="hero-fallback" class="spin-slow pointer-events-none absolute -right-[10%] top-1/2 h-[min(90vw,780px)] w-[min(90vw,780px)] -translate-y-1/2 text-white/[0.07]" aria-hidden="true"><use href="#i-shuriken" /></svg>
      <div class="hero-shade absolute inset-0" aria-hidden="true"></div>

      <div class="relative mx-auto w-full max-w-[1400px] px-5 pb-20 pt-36 sm:px-8 lg:px-14">
        <div class="max-w-2xl">
          <p class="mb-6 flex flex-wrap gap-2 text-xs font-bold tracking-widest">
            <span class="rounded bg-accent px-2.5 py-1">SUB DPS</span>
            <span class="rounded bg-white/15 px-2.5 py-1 backdrop-blur" data-bind="role"></span>
            <span class="rounded bg-white/15 px-2.5 py-1 backdrop-blur" data-bind="position"></span>
          </p>
          <h1 id="headline" class="headline text-[2.6rem] font-extrabold leading-[1.15] tracking-tight drop-shadow-sm sm:text-6xl lg:text-7xl"></h1>
          <p class="mt-6 max-w-xl text-lg leading-relaxed text-white/85 sm:text-xl" data-bind="intro"></p>

          <!-- 정보 행: 동그란 아이콘 배지 + 텍스트 -->
          <ul class="mt-10 space-y-4 text-lg font-medium">
            <li class="flex items-center gap-4">
              <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white/20 backdrop-blur"><svg class="h-5 w-5" aria-hidden="true"><use href="#i-user" /></svg></span>
              <span>영웅 · <span data-bind="hero"></span></span>
            </li>
            <li class="flex items-center gap-4">
              <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white/20 backdrop-blur"><svg class="h-5 w-5" aria-hidden="true"><use href="#i-target" /></svg></span>
              <span><span data-bind="role"></span> · <span data-bind="position"></span></span>
            </li>
          </ul>

          <div class="mt-12 flex flex-wrap gap-3">
            <a href="#contact" class="cta btn-accent inline-flex items-center gap-2 rounded-md px-7 py-4 text-lg font-bold">
              연락하기 <span class="cta-arrow" aria-hidden="true">→</span>
            </a>
            <a href="#projects" class="inline-flex items-center rounded-md bg-white/15 px-7 py-4 text-lg font-bold backdrop-blur transition-colors hover:bg-white/25">
              프로젝트 보기
            </a>
          </div>
        </div>
      </div>

      <p class="absolute inset-x-0 bottom-0 border-t border-white/10 bg-black/15 px-5 py-4 text-[11px] font-medium tracking-widest text-white/60 backdrop-blur sm:px-8 lg:px-14" data-bind="meta"></p>
    </section>

    <!-- 01 소개: 왼쪽 소개 글 + 오른쪽 메뉴형 패널 -->
    <section id="about">
      <div class="mx-auto grid max-w-[1400px] items-start gap-12 px-5 py-24 sm:px-8 lg:grid-cols-[1fr_480px] lg:gap-16 lg:px-14 lg:py-32">
        <div class="reveal">
          <p class="text-xs font-bold tracking-widest text-accent">01 — 소개</p>
          <p class="mt-8 text-sm font-semibold tracking-[0.3em] text-muted" data-bind="subtitle"></p>
          <h2 class="mt-2 text-6xl font-black tracking-tight sm:text-7xl lg:text-8xl" data-bind="name"></h2>
          <p class="mt-8 max-w-xl text-lg leading-relaxed text-muted" data-bind="intro"></p>

          <dl class="mt-10 grid max-w-md grid-cols-2 gap-4">
            <div class="panel rounded-lg p-5">
              <dt class="text-xs font-bold tracking-widest text-muted">ROLE</dt>
              <dd class="mt-1 text-2xl font-bold" data-bind="role"></dd>
            </div>
            <div class="panel rounded-lg p-5">
              <dt class="text-xs font-bold tracking-widest text-muted">DIFFICULTY</dt>
              <dd id="difficulty" class="mt-1 text-2xl tracking-widest text-accent"></dd>
            </div>
          </dl>
        </div>

        <div class="reveal panel overflow-hidden rounded-lg">
          <div class="panel-top px-5 py-4">
            <p class="flex items-center gap-3 text-lg font-semibold">
              <svg class="h-5 w-5 text-accent" aria-hidden="true"><use href="#i-shuriken" /></svg>
              <span data-bind="hero"></span> 플레이 스타일
            </p>
          </div>
          <p class="px-5 pb-2 pt-5 text-xs font-bold tracking-wider text-muted">ABILITIES</p>
          <div id="abilities" class="flex flex-col pb-2" role="group" aria-label="능력 선택"></div>
          <div class="mx-5 mb-5 min-h-[5.5rem] rounded-md bg-white/70 p-4" aria-live="polite">
            <p id="ability-title" class="font-bold"></p>
            <p id="ability-desc" class="mt-1 text-sm leading-relaxed text-muted"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- 02 기술 스택 -->
    <section id="skills">
      <div class="mx-auto max-w-[1400px] px-5 pb-24 sm:px-8 lg:px-14 lg:pb-32">
        <div class="reveal panel grid gap-10 rounded-lg p-8 sm:p-12 lg:grid-cols-[1fr_2fr]">
          <div>
            <p class="text-xs font-bold tracking-widest text-accent">02 — 기술 스택</p>
            <h2 class="mt-4 text-4xl font-extrabold tracking-tight sm:text-5xl">핵심 기술</h2>
          </div>
          <ul id="skill-list" class="space-y-10"></ul>
        </div>
      </div>
    </section>

    <!-- 03 프로젝트: 카드 3개 -->
    <section id="projects">
      <div class="mx-auto max-w-[1400px] px-5 pb-24 sm:px-8 lg:px-14 lg:pb-32">
        <div class="reveal">
          <p class="text-xs font-bold tracking-widest text-accent">03 — 프로젝트</p>
          <h2 class="mt-4 text-4xl font-extrabold tracking-tight sm:text-5xl">포트폴리오</h2>
        </div>
        <ul id="project-list" class="mt-12 grid gap-6 md:grid-cols-3"></ul>
      </div>
    </section>

    <!-- 04 연락처 -->
    <section id="contact" class="hero-bg text-soft">
      <div class="mx-auto max-w-[1400px] px-5 py-24 sm:px-8 lg:px-14 lg:py-32">
        <div class="reveal">
          <p class="text-xs font-bold tracking-widest text-lime">04 — 연락처</p>
          <h2 class="mt-4 text-4xl font-extrabold tracking-tight text-white sm:text-5xl">함께 플레이해요</h2>
          <div class="mt-10 flex flex-col gap-6 rounded-lg border border-white/15 bg-white/10 p-6 backdrop-blur sm:flex-row sm:items-center sm:justify-between sm:p-8">
            <a id="email-link" class="break-all text-2xl font-semibold tracking-tight text-white underline decoration-white/30 decoration-1 underline-offset-8 transition-colors hover:decoration-lime sm:text-4xl"></a>
            <button id="copy-btn" type="button" class="btn-accent shrink-0 rounded-md px-6 py-3.5 text-[15px] font-bold">
              이메일 복사
            </button>
          </div>
        </div>
      </div>

      <footer class="border-t border-white/10">
        <div class="mx-auto flex max-w-[1400px] flex-col gap-2 px-5 py-6 text-[11px] font-medium tracking-widest text-white/50 sm:flex-row sm:justify-between sm:px-8 lg:px-14">
          <span data-bind="meta"></span>
          <span>© <span id="year"></span> <span data-bind="name"></span></span>
        </div>
      </footer>
    </section>
  </main>

  <div id="toast" role="status" class="fixed bottom-6 z-50 rounded-md bg-ink px-5 py-3 text-sm font-medium text-white shadow-lg"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
